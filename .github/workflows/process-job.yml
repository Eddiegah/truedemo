name: Process Job

# Triggered via the GitHub API (workflow_dispatch) from the Next.js backend
# when a job is submitted - this IS the job queue for TrueDemo. No Redis,
# no persistent worker container: GitHub Actions' own runner scheduling
# provides queueing at zero cost, which is the whole point of this
# architecture choice (see README for the full reasoning).
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID (Postgres row id)"
        required: true
        type: string
      url:
        description: "App URL to explore"
        required: true
        type: string
      repo_url:
        description: "Optional GitHub repo URL for code grounding"
        required: false
        type: string
        default: ""

permissions:
  contents: write  # needed to publish the finished video as a GitHub Release asset

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg, caption font)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        working-directory: worker
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        working-directory: worker
        run: python -m playwright install --with-deps chromium

      - name: Run pipeline
        working-directory: worker/src
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py \
            --job-id "${{ inputs.job_id }}" \
            --url "${{ inputs.url }}" \
            --repo-url "${{ inputs.repo_url }}" \
            --webhook-url "${{ secrets.WEBHOOK_URL }}" \
            --webhook-secret "${{ secrets.WEBHOOK_SECRET }}"
